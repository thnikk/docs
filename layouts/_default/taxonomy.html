{{ define "main" }}
  <div class="page-container">
    <article class="content">
      <main id="content" class="card">
        <div class="card-header">
          <h1>{{ .Title }}</h1>
          <div class="card-meta">
            <a class="blog-nav-link" href="{{ "tags/" | relLangURL }}">&larr; All tags</a>
          </div>
        </div>
        <div class="content-body">
          <div class="blog-posts">
            {{- range .Pages.ByDate.Reverse }}
              <article class="card blog-post">
                <div class="card-header">
                  <h1><a href="{{ .RelPermalink }}">{{ .Title }}</a></h1>
                  <div class="card-meta">
                    <time class="last-updated" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "January 2, 2006" }}</time>
                  </div>
                </div>
              </article>
            {{- end }}
          </div>
        </div>
      </main>
    </article>
  </div>
{{ end }}
